<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="shortcut icon" href="imagens/Adora-L2.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Portifólio</title>
</head>
<body>

    <header>
        <p id="logo">ADORA</p>
        <ul class="menu">
            <li>Home</li>
            <li>Sobre mim</li>
            <li>Contato</li>
            <li id="icon_menu"><span class="material-symbols-outlined">menu</span></li>
        </ul>

        <div class="cover">
            <img src="imagens/cover.jpg" alt="Album Cover" id="album">
            <img src="imagens/vinil.png" alt="Vinil Disk" id="disk">
        </div>

        <div class="title">
            <p id="dev">GAME DEVELOPER</p>
            <hr id="line">
            <h1 id="my">Meu</h1>
            <h2 id="portifoly">Portifólio</h2>
            <img src="imagens/jack.png" alt="Jack" id="character">
            <img src="imagens/sephe.png" alt="Sephe" id="seph">
        </div>
    </header>

    <main>
        <section class="sobre">
            <h2 id="on">Sobre mim</h2>
            <h3 id="hello">Olá</h3>
            <img src="imagens/letter.webp" alt="Envelope" id="letter">
            <div id="photo">
                <img src="imagens/Sophie.jpeg" alt="Sophie Tatcher" id="sophie">
                <p id="id">Adora-L</p>
                <p id="age">18 Anos</p>
                <p id="lang">PT-BR</p>
            </div>
            <img src="imagens/flag.png" alt="Bandeira do Brasil" id="flag">
            <img src="imagens/Adora.png" alt="Adora_Pyxel" id="Im">
            <div id="subtitle">
                <p id="game">Game</p>
                <p id="profile">Dev</p>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="JS/script.JS"></script>
</body>
</html>
